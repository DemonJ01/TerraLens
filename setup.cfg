[metadata]
name = terralens
version = 0.1.0
description = TerraLens: neighborhood estimates from open urban data

[options]
packages = find:
include_package_data = False

[options.packages.find]
include = terralens*
exclude =
    data*
    outputs*
    configs*
    experiments*
    scripts*
    notebooks*
    docs*
    tests*
